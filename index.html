<body class="bg-gray-100 min-h-screen relative text-gray-800">

                </div>

    </main>

        </div>
    </div>

        // ==========================================
        // 📚 中二級 完整資料庫 (第一至第三學期 60 個成語 + 題庫)
        // ==========================================
        const termData = {
            1: {
                title: "第一學期",
                idioms: [
                    { word: "字斟句酌", exp: "形容作文章或說話時態度謹慎，再三推敲字句。", origin: "清．紀昀《閱微草堂筆記》", story: "「斟」、「酌」原指倒酒，引申為考慮、推敲。指寫文章或說話時，對每一個字、每一句話都仔細思考、反覆推敲，務求妥切。" },
                    { word: "如魚得水", exp: "比喻得到和自己意氣相投的人或很適合的環境。", origin: "《三國志．蜀書．諸葛亮傳》", story: "三國時，劉備得到諸葛亮的輔佐，非常高興，對結拜兄弟關羽和張飛說：「我得到孔明，就像魚得到水一樣啊！」" },
                    { word: "如夢初醒", exp: "好像剛從夢中醒來。比喻從糊塗、錯誤中恍然大悟。", origin: "明．馮夢龍《東周列國志》", story: "形容人本來對某件事物或道理完全不了解，後來經過別人的指點或經歷某事後，突然徹底明白過來。" },
                    { word: "杞人憂天", exp: "比喻缺乏根據且不必要的憂慮。", origin: "《列子．天瑞》", story: "傳說杞國有一個人，整天擔心天會塌下來、地會陷下去，自己會無處安身，為此愁得睡不著覺、吃不下飯。後用來比喻不必要的憂慮。" },
                    { word: "更勝一籌", exp: "比較之下，較為優秀或突出。", origin: "清．蒲松齡《聊齋志異》", story: "「籌」是古代計數的用具。指在兩者相互比較之下，其中一方比另一方還要高明、優秀一點。" },
                    { word: "束手待斃", exp: "形容遇到困難時，不思解決或無能為力，只能等死。", origin: "明．羅貫中《三國演義》", story: "「束手」指綁起雙手。比喻面對危險或困境時，完全放棄抵抗或想不出任何辦法，只能坐以待斃。" },
                    { word: "扶老攜幼", exp: "攙扶著老人，帶領著小孩。形容群眾結伴而行的情況。", origin: "《戰國策．齊策四》", story: "戰國時孟嘗君被罷官回封地，封地的人民不分男女老少，攙扶著老人，牽著小孩，走到百里外去迎接他。形容大批人熱烈參與或逃難的情景。" },
                    { word: "抑揚頓挫", exp: "形容聲音的高低起伏和停頓轉折。", origin: "晉．陸機《文賦》", story: "「抑」是降低，「揚」是升高，「頓」是停頓，「挫」是轉折。多用來形容音樂、朗誦或說話的聲音富有節奏與情感變化，十分悅耳動聽。" },
                    { word: "利令智昏", exp: "因貪圖私利而使頭腦發昏，失去理智。", origin: "《史記．平原君虞卿列傳》", story: "戰國時趙國平原君因貪圖韓國上黨郡的土地，接受了降書，結果引來秦國大軍攻擊，爆發長平之戰，趙軍大敗。司馬遷批評他被利益蒙蔽了理智。" },
                    { word: "作賊心虛", exp: "比喻做了壞事，害怕被人發覺而內心不安。", origin: "宋．釋悟明《聯燈會要》", story: "原為禪宗語，指做賊的人總覺得別人都在注意他。後泛指做了錯事或壞事的人，因為害怕被揭發而顯得神情緊張、心裡恐慌。" },
                    { word: "言簡意賅", exp: "言語簡練，意思完備。", origin: "清．崔述《讀風閣詩作》", story: "「簡」是簡潔，「賅」是完備。形容說話或寫文章非常精煉，用的字數很少，但所表達的意思卻非常完整而深刻。" },
                    { word: "孜孜不倦", exp: "指工作或學習勤奮刻苦，不知疲倦。", origin: "《尚書．君陳》", story: "「孜孜」是勤勉不懈的樣子。形容人無論是在求學還是工作上，都十分勤奮努力，從不感到疲倦或懈怠。" },
                    { word: "玩物喪志", exp: "指迷戀於所愛好的事物，而消磨了向上進取的志氣。", origin: "《書經．旅獒》", story: "周武王滅商後，有西方國家進貢了名為「獒」的大狗。太保召公奭勸諫武王不要沉迷於把玩奇珍異獸，以免喪失了治理天下的遠大志向。" },
                    { word: "青紅皂白", exp: "比喻事情的始末、是非曲直。", origin: "明．凌濛初《二刻拍案驚奇》", story: "「皂」是黑色。青、紅、黑、白四種顏色。常用於「不分青紅皂白」，比喻人不問事情的緣由、不分對錯，就糊塗地發脾氣或下定論。" },
                    { word: "東施效顰", exp: "比喻盲目模仿，結果卻適得其反，顯得愚笨可笑。", origin: "《莊子．天運》", story: "春秋時越國美女西施因心痛而皺眉（顰），同村的醜女東施覺得很美，也故意捂著胸口皺眉，結果反而醜得讓人避之唯恐不及。" },
                    { word: "披荊斬棘", exp: "比喻克服重重困難，清除障礙，艱苦創業。", origin: "《後漢書．馮異傳》", story: "東漢大將馮異為光武帝劉秀打天下，劉秀稱讚他：「為我披開荊棘，平定關中。」比喻在創業或前進的道路上，努力清除各種困難與障礙。" },
                    { word: "虎頭蛇尾", exp: "比喻做事有始無終，起初聲勢很大，後來卻無聲無息。", origin: "元．康進之《李逵負荊》", story: "頭大如虎，尾細如蛇。用來形容人做事一開始勁頭十足、聲勢浩大，但到了後來卻馬馬虎虎，沒有堅持到底把事情做好。" },
                    { word: "刮目相看", exp: "指別人已有進步，不能再用老眼光去看他。", origin: "《三國志．吳書．呂蒙傳》", story: "三國吳將呂蒙聽從孫權勸告發奮讀書。後來魯肅與他交談，驚訝於他的學識大增。呂蒙說：「士別三日，即更刮目相待。」意指要抹去舊看法，用新眼光來看待。" },
                    { word: "金玉其外，敗絮其中", exp: "比喻外表華美，但內在卻敗壞。", origin: "明．劉基《賣柑者言》", story: "明代劉伯溫買了一個柑橘，外表金黃漂亮，剝開一看，裡面卻乾枯得像破棉絮（敗絮）。後用來諷刺虛有其表、表裡不一的人或事物。" },
                    { word: "受寵若驚", exp: "因意外受到寵愛或賞識而感到驚喜與不安。", origin: "《老子》第十三章", story: "老子認為得到寵愛和受到屈辱都會讓人驚恐不安。後人專指因為突然得到長輩、上司或大人物的過度優待和賞識，感到驚喜又有些害怕。" }
                ],

                    { q: "＿目相看", options: ["括", "刮", "掛", "寡"], ans: 1, base: "刮目相看" },
                    { q: "敗＿其中", options: ["序", "絮", "敘", "恤"], ans: 1, base: "金玉其外，敗絮其中" },

                ],
                test3: [
                    { q: "這篇文章寫得____，沒有一句廢話，卻把道理說得很清楚。", options: ["言簡意賅", "玩物喪志", "作賊心虛", "虎頭蛇尾"], ans: 0, base: "言簡意賅" },
                    { q: "他到了這家重視創意的公司後，簡直是____，充分發揮了才華。", options: ["束手待斃", "如魚得水", "杞人憂天", "東施效顰"], ans: 1, base: "如魚得水" },
                    { q: "別再____了，那座火山已經死了一萬年，是不會突然爆發的。", options: ["杞人憂天", "如夢初醒", "孜孜不倦", "刮目相看"], ans: 0, base: "杞人憂天" },
                    { q: "經過幾年的刻苦訓練，他的球技已經____，不再是當年的新手了。", options: ["更勝一籌", "利令智昏", "披荊斬棘", "刮目相看"], ans: 3, base: "刮目相看" },
                    { q: "這家黑心企業包裝精美，但產品全是劣質品，真是____。", options: ["青紅皂白", "金玉其外，敗絮其中", "扶老攜幼", "抑揚頓挫"], ans: 1, base: "金玉其外，敗絮其中" },
                    { q: "聽了老師的詳細解釋，我才____，原來這道題我是這麼錯的。", options: ["如夢初醒", "受寵若驚", "作賊心虛", "字斟句酌"], ans: 0, base: "如夢初醒" },
                    { q: "他做事總是____，開頭轟轟烈烈，最後卻草草收場。", options: ["虎頭蛇尾", "披荊斬棘", "玩物喪志", "孜孜不倦"], ans: 0, base: "虎頭蛇尾" },

                    { q: "校長親自頒獎並稱讚他，讓他感到____。", options: ["受寵若驚", "作賊心虛", "如夢初醒", "杞人憂天"], ans: 0, base: "受寵若驚" },
                    { q: "朗誦詩歌時，聲音要____，才能表達出詩中的情感。", options: ["抑揚頓挫", "言簡意賅", "青紅皂白", "更勝一籌"], ans: 0, base: "抑揚頓挫" }
                ]
            },
            2: {
                title: "第二學期",
                idioms: [
                    { word: "肺腑之言", exp: "發自內心的真誠話語。", origin: "唐．白居易《代書詩一百韻寄微之》", story: "「肺腑」指內臟，比喻內心深處。形容人所說的話非常真誠，毫無虛假，完全是從心底裡說出來的真實感受或勸告。" },
                    { word: "狐假虎威", exp: "比喻憑恃有權者的威勢恐嚇他人、作威作福。", origin: "《戰國策．楚策一》", story: "狐狸被老虎抓住，狐狸騙老虎說自己是天帝派來管百獸的，不信就跟在牠後面看。百獸看到老虎都嚇跑了，老虎卻以為牠們是怕狐狸。比喻藉別人的威勢來欺壓人。" },
                    { word: "夜郎自大", exp: "比喻人見識短淺，卻又狂妄自大。", origin: "《史記．西南夷列傳》", story: "漢朝使者到了西南方的小國夜郎，夜郎國王不知漢朝疆域遼闊，竟然問使者：「漢朝和我們夜郎相比，哪一個比較大？」後用來比喻無知而自大。" },
                    { word: "刻不容緩", exp: "形容情勢十分緊迫，一刻也不容耽擱。", origin: "清．李汝珍《鏡花緣》", story: "「刻」是短暫的時間，「緩」是延遲。形容事情已經到了非常緊急的關頭，連一小段時間都不能拖延，必須立刻處理。" },
                    { word: "沾沾自喜", exp: "形容自以為不錯而得意的樣子。", origin: "《史記．魏其武安侯列傳》", story: "「沾沾」是輕薄、得意的樣子。形容人因為取得了一點點小成績或小聰明，就覺得自己很了不起，暗自得意。" },
                    { word: "孤陋寡聞", exp: "學識淺薄，見聞不廣。", origin: "《禮記．學記》", story: "「孤」指獨學無友，「陋」指見識淺薄。古人指出如果獨自學習而沒有朋友交流，就會見識短淺。形容人學識不足，見聞狹隘。" },

                ],
                test3: [
                    { q: "面對歹徒的威脅，他____，保護了車上所有的乘客。", options: ["挺身而出", "鬼鬼祟祟", "從善如流", "得過且過"], ans: 0, base: "挺身而出" },
                    { q: "大家只要____，就一定能戰勝這次的自然災害。", options: ["眾志成城", "破釜沉舟", "氣宇軒昂", "莫逆之交"], ans: 0, base: "眾志成城" },
                    { q: "他____地告訴大家，這次的比賽目標只有一個，那就是冠軍！", options: ["斬釘截鐵", "莫名其妙", "從容不迫", "啞口無言"], ans: 0, base: "斬釘截鐵" },
                    { q: "這幅畫裡的牡丹花畫得____，彷彿還能聞到花香。", options: ["栩栩如生", "眼花繚亂", "冥頑不靈", "氣宇軒昂"], ans: 0, base: "栩栩如生" },
                    { q: "為了這次的考試，他已經____地溫習了三個星期。", options: ["堅持不懈", "馬不停蹄", "得過且過", "捧腹大笑"], ans: 0, base: "堅持不懈" },
                    { q: "他這個人____，只要是對公司好的建議，他都會馬上採納。", options: ["從善如流", "冥頑不靈", "趾高氣揚", "莫名其妙"], ans: 0, base: "從善如流" },
                    { q: "看見他那____的樣子，我就知道他一定又在考場上作弊了。", options: ["鬼鬼祟祟", "氣宇軒昂", "從容不迫", "挺身而出"], ans: 0, base: "鬼鬼祟祟" },
                    { q: "這支球隊展現了____的決心，在最後一分鐘逆轉了比賽。", options: ["破釜沉舟", "眾志成城", "專心致志", "莫逆之交"], ans: 0, base: "破釜沉舟" },
                    { q: "雖然發生了突發狀況，但主持人依然____地控制住了場面。", options: ["從容不迫", "馬不停蹄", "趾高氣揚", "莫名其妙"], ans: 0, base: "從容不迫" },
                    { q: "被警察出示了確鑿的監視器證據後，嫌疑犯頓時____。", options: ["啞口無言", "捧腹大笑", "眼花繚亂", "冥頑不靈"], ans: 0, base: "啞口無言" }
                ]
            }
        };

        let currentTerm = 1;
        let currentMode = 'study';
        let activeTestQuestions = [];

        // ==========================================
        // 核心邏輯
        // ==========================================
        
        // 陣列洗牌函數
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // 開關典故視窗
        function openModal(termIdx, idiomIdx) {
            const item = termData[termIdx].idioms[idiomIdx];
            document.getElementById('modal-word').innerText = item.word;
            document.getElementById('modal-exp').innerText = item.exp;
            document.getElementById('modal-origin').innerText = item.origin;
            document.getElementById('modal-story').innerText = item.story;
            document.getElementById('idiom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('idiom-modal').classList.add('hidden');
        }

        // 切換學期
        function selectTerm(term) {
            currentTerm = term;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${term}`).classList.add('active');
            renderContent();
        }

        // 切換模式
        function selectMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.sub-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`mode-${mode}`).classList.add('active');
            renderContent();
        }

        // 渲染主要畫面
        function renderContent() {
            const area = document.getElementById('content-area');
            area.innerHTML = ''; 
            const data = termData[currentTerm];

            // 模式：自學
            if (currentMode === 'study') {
                let html = `<h2 class="text-2xl font-bold mb-4 text-blue-800">${data.title} - 成語自學區 <span class="text-base text-gray-500 font-normal">(點擊卡片可放大看典故)</span></h2><div class="grid md:grid-cols-2 gap-6">`;
                data.idioms.forEach((item, index) => {
                    html += `
                    <div onclick="openModal(${currentTerm}, ${index})" class="idiom-card bg-blue-50 border-l-4 border-blue-500 p-5 rounded shadow-sm flex flex-col justify-between cursor-pointer transition">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800 flex items-center justify-between">
                                ${item.word}
                                <span class="text-xs bg-blue-200 text-blue-800 px-2 py-1 rounded font-normal">🔍 點我看典故</span>
                            </h3>
                            <p class="text-gray-700 mt-2 line-clamp-2"><strong>解釋：</strong>${item.exp}</p>
                        </div>
                    </div>`;
                });
                html += `</div>`;
                area.innerHTML = html;
            
            // 模式：測驗
            } else if (currentMode === 'test1' || currentMode === 'test2' || currentMode === 'test3') {
                let pool = [];
                let title = "";
                
                if (currentMode === 'test1') {
                    pool = data.test1;
                    title = "測驗一：字詞辨識 (選出缺少的正確字詞)";
                } else if (currentMode === 'test3') {
                    pool = data.test3;
                    title = "測驗三：成語應用 (選出適合句子的成語)";
                } else if (currentMode === 'test2') {
                    // 測驗二：動態生成成語配對題庫
                    title = "測驗二：成語配對 (根據解釋選出正確的成語)";
                    let allIdioms = data.idioms;
                    pool = allIdioms.map(item => {
                        let wrongOptions = allIdioms.filter(x => x.word !== item.word);
                        wrongOptions = shuffleArray([...wrongOptions]).slice(0, 3).map(x => x.word);
                        let options = [item.word, ...wrongOptions];
                        options = shuffleArray(options);
                        return {
                            q: `請問「<span class="text-blue-700 font-bold">${item.exp}</span>」是以下哪一個成語的解釋？`,
                            options: options,
                            ans: options.indexOf(item.word),
                            base: item.word
                        };
                    });
                }

                if(pool.length === 0) {
                    area.innerHTML = `<p class="text-gray-500 text-center py-10">此學期的測驗題目尚待擴充。</p>`;
                    return;
                }

                // 去重複抽題機制：確保10題對應10個不同的成語 (base 不重複)
                let shuffledPool = shuffleArray([...pool]);
                activeTestQuestions = [];
                let usedBase = new Set();
                
                for (let t of shuffledPool) {
                    if (!usedBase.has(t.base)) {
                        usedBase.add(t.base);
                        activeTestQuestions.push(t);
                    }
                    if (activeTestQuestions.length === 10) break;
                }
                
                if (activeTestQuestions.length < 10) {
                    for (let t of shuffledPool) {
                        if (activeTestQuestions.length === 10) break;
                        if (!activeTestQuestions.includes(t)) activeTestQuestions.push(t);
                    }
                }
                
                let html = `<h2 class="text-2xl font-bold mb-4 text-blue-800">${data.title} - ${title}</h2>`;
                html += `<p class="text-gray-600 mb-6 bg-yellow-50 p-3 rounded border border-yellow-200 shadow-sm text-sm">💡 系統提示：題目已從題庫隨機抽出，每次測驗皆不相同，且保證10題考核10個不同的成語。滿分為 10 分。</p>`;
                
                // 表單開始
                html += `<form id="quiz-form" onsubmit="submitQuiz(event)" class="space-y-6">`;
                
                // 學生資料輸入區塊
                html += `
                <div class="bg-indigo-50 border border-indigo-200 p-5 rounded-lg mb-6 shadow-sm">
                    <h3 class="font-bold text-indigo-800 mb-3 flex items-center">👤 學生資料 (交卷前必填)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="text" id="student-class" placeholder="班別 (例: 2A)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.className}" required>
                        <input type="number" id="student-no" placeholder="學號 (例: 01)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.classNo}" required>
                        <input type="text" id="student-name" placeholder="姓名 (例: Chan Tai Man)" class="p-2.5 rounded border focus:ring-2 focus:ring-indigo-300 outline-none" value="${currentStudent.studentName}" required>
                    </div>
                </div>`;

                // 題目區塊
                activeTestQuestions.forEach((t, index) => {
                    html += `
                    <div class="bg-gray-50 p-5 rounded shadow-sm border border-gray-100 hover:border-blue-300 transition">
                        <p class="text-lg mb-4 leading-relaxed"><strong>${index + 1}.</strong> ${t.q}</p>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                    t.options.forEach((opt, optIdx) => {
                        html += `
                            <label class="flex items-center p-3 bg-white border rounded shadow-sm cursor-pointer hover:bg-blue-50 hover:border-blue-400 transition">
                                <input type="radio" name="q${index}" value="${optIdx}" class="mr-3 w-4 h-4 text-blue-600 focus:ring-blue-500" required>
                                <span class="font-medium text-gray-800">${opt}</span>
                            </label>`;
                    });
                    html += `</div></div>`;
                });
                
                html += `<button type="submit" id="submit-test-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg shadow-md hover:bg-blue-700 transition transform hover:scale-[1.01] text-lg mt-4">交卷並看結果！</button>`;
                html += `</form><div id="result-area" class="mt-8 mb-6 text-center"></div>`;
                area.innerHTML = html;
            }
        }

        // 交卷邏輯與傳送成績
        function submitQuiz(e) {
            e.preventDefault();
            
            // 記錄學生資料
            const classNameInput = document.getElementById('student-class').value;
            const classNoInput = document.getElementById('student-no').value;
            const studentNameInput = document.getElementById('student-name').value;
            
            currentStudent = {
                className: classNameInput,
                classNo: classNoInput,
                studentName: studentNameInput
            };

            const form = new FormData(e.target);
            let score = 0;
            let resultDetailsHtml = '<div class="mt-6 space-y-4 text-left text-base font-normal">';

            // 對答案
            activeTestQuestions.forEach((t, index) => {
                const userAnswer = parseInt(form.get(`q${index}`));
                const isCorrect = (userAnswer === t.ans);
                
                if (isCorrect) score += 1; 
                
                let correctText = t.options[t.ans];
                let userText = isNaN(userAnswer) ? "未作答" : t.options[userAnswer];
                let cardClass = isCorrect ? "bg-green-50 border-green-300" : "bg-red-50 border-red-300";
                
                resultDetailsHtml += `
                <div class="p-5 rounded-lg border-2 ${cardClass}">
                    <p class="text-gray-800 mb-3 font-medium">${index + 1}. ${t.q}</p>
                    <div class="flex flex-col sm:flex-row sm:gap-6 gap-2">
                        <p class="text-gray-700">你的答案：<span class="font-bold text-lg ${isCorrect ? 'text-green-700' : 'text-red-600 line-through'}">${userText}</span></p>
                        ${!isCorrect ? `<p class="text-gray-700">正確答案：<span class="font-bold text-lg text-green-700">${correctText}</span></p>` : ''}
                    </div>
                </div>`;
            });
            resultDetailsHtml += '</div>';

            // 準備傳送給 GAS 的資料
            const testNames = { 'test1': '字詞辨識', 'test2': '成語配對', 'test3': '成語應用' };
            const payload = {
                className: currentStudent.className,
                classNo: currentStudent.classNo,
                studentName: currentStudent.studentName,
                term: `第 ${currentTerm} 學期`,
                testType: testNames[currentMode],
                score: score,
                maxScore: 10
            };

            // 介面鎖定
            const submitBtn = document.getElementById('submit-test-btn');
            submitBtn.innerText = "成績傳送中，請稍候...";
            submitBtn.disabled = true;
            submitBtn.classList.replace("bg-blue-600", "bg-gray-400");
            submitBtn.classList.replace("hover:bg-blue-700", "hover:bg-gray-400");
            document.querySelectorAll('input[type="radio"], input[type="text"], input[type="number"]').forEach(input => input.disabled = true);

            // 定義顯示最終結果的函數
            const showFinalResult = (fetchMessage = "") => {
                const resultArea = document.getElementById('result-area');
                let scoreMessage = '';
                
                if(score === 10) {
                    scoreMessage = `<div class="text-4xl font-extrabold text-green-600 mb-2">太棒了！你的分數是 ${score} / 10 滿分！🎉</div>`;
                } else if(score >= 6) {
                    scoreMessage = `<div class="text-4xl font-extrabold text-blue-600 mb-2">表現不錯！你的分數是 ${score} / 10。👍</div>`;
                } else {
                    scoreMessage = `<div class="text-4xl font-extrabold text-red-600 mb-2">你的分數是 ${score} / 10。💪</div>`;
                }
                
                let fetchWarningHtml = fetchMessage ? `<p class="text-sm text-yellow-600 bg-yellow-100 p-2 rounded mb-4 inline-block">${fetchMessage}</p>` : '';

                let retryBtnHtml = `
                    <div class="mt-6 mb-8">
                        <button onclick="renderContent()" class="w-full md:w-1/2 mx-auto px-8 bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 shadow-lg transition transform hover:-translate-y-1 text-lg flex justify-center items-center gap-2">
                            <span>🔄 重新測驗 (抽取全新題目)</span>
                        </button>
                        <p class="text-gray-500 text-sm mt-3">覺得這套題目太簡單？按上面按鈕挑戰新的隨機組合！</p>
                    </div>
                `;

                submitBtn.style.display = 'none';
                resultArea.innerHTML = scoreMessage + fetchWarningHtml + retryBtnHtml + `<h3 class="text-gray-600 mt-6 font-bold text-xl border-b pb-2 text-left">📝 對錯詳情分析</h3>` + resultDetailsHtml;
                resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // 執行 Fetch 發送數據到 Google Sheet
            if (GAS_URL === "在此處貼上你的_GOOGLE_APPS_SCRIPT_網址" || GAS_URL === "") {
                setTimeout(() => {
                    showFinalResult("⚠️ 提示：因為張SIR尚未設定真實的 GAS 網址，本次成績未傳送至後台，但你仍可查看結果！");
                }, 800); 
            } else {
                fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(result => {
                    showFinalResult(); 
                })
                .catch(error => {
                    console.error("Error:", error);
                    showFinalResult("⚠️ 提示：成績傳送至後台失敗，請檢查網絡連線。");
                });
            }
        }

        // 初始化載入
        selectTerm(1);
        selectMode('study');
    </script>
</body>
</html>
